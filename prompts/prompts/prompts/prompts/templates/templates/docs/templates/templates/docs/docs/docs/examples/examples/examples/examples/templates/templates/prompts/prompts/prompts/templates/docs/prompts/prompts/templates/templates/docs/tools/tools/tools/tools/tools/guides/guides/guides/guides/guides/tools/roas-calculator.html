<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROAS Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            padding: 40px 20px;
        }

        .calculator {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        #result {
            margin-top: 25px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>ROAS Calculator</h1>

    <label for="revenue">Revenue</label>
    <input type="number" id="revenue" placeholder="Enter revenue">

    <label for="spend">Ad Spend</label>
    <input type="number" id="spend" placeholder="Enter ad spend">

    <button onclick="calculateROAS()">Calculate ROAS</button>

    <div id="result"></div>

</div>

<script>
function calculateROAS() {

    const revenue = Number(document.getElementById("revenue").value);
    const spend = Number(document.getElementById("spend").value);
    const result = document.getElementById("result");

    if (revenue <= 0 || spend <= 0) {
        result.textContent = "Please enter valid values.";
        return;
    }

    const roas = revenue / spend;

    result.textContent = "ROAS: " + roas.toFixed(2) + "x";
}
</script>

</body>
</html>
