<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPL Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            padding: 40px 20px;
        }

        .calculator {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        #result {
            margin-top: 25px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>CPL Calculator</h1>

    <label for="spend">Total Ad Spend</label>
    <input type="number" id="spend" placeholder="Enter ad spend">

    <label for="leads">Total Leads</label>
    <input type="number" id="leads" placeholder="Enter number of leads">

    <button onclick="calculateCPL()">Calculate CPL</button>

    <div id="result"></div>

</div>

<script>
function calculateCPL() {

    const spend = Number(document.getElementById("spend").value);
    const leads = Number(document.getElementById("leads").value);
    const result = document.getElementById("result");

    if (spend <= 0 || leads <= 0) {
        result.textContent = "Please enter valid values.";
        return;
    }

    const cpl = spend / leads;

    result.textContent = "CPL: ₹" + cpl.toFixed(2);
}
</script>

</body>
</html>
